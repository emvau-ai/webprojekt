}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  min-height:100%;background:var(--bg);color:var(--text1);
  font-family:var(--font);overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
body{
  background:
    radial-gradient(1100px 640px at 8% -6%, rgba(10,132,255,0.22), transparent 55%),
    radial-gradient(820px 560px at 96% 2%, rgba(94,92,230,0.18), transparent 52%),
    radial-gradient(760px 600px at 50% 108%, rgba(48,209,88,0.10), transparent 58%),
    linear-gradient(180deg,#06070b 0%,#05060a 46%,#0a0d15 100%);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0.04),transparent 16%,rgba(255,255,255,0.015));
}
/* Scrollbar */
::-webkit-scrollbar{width:0px;}
/* Range slider — iOS style */
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;
  border-radius:999px;background:linear-gradient(90deg,var(--blue),rgba(120,124,145,0.55));outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;background:#fff;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,0.5),0 0 0 6px rgba(255,255,255,0.08);
}
input[type=range]::-moz-range-thumb{
  width:26px;height:26px;border:none;
  border-radius:50%;background:#fff;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,0.5),0 0 0 6px rgba(255,255,255,0.08);
}
input[type=range]:disabled{opacity:0.4;}
/* Password input */
input[type=password]{
  width:100%;padding:14px 16px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:14px;
  color:var(--text1);font-family:var(--font);font-size:16px;outline:none;
  -webkit-appearance:none;transition:border-color .2s ease, box-shadow .2s ease;
}
input[type=password]:focus{border-color:rgba(10,132,255,0.55);box-shadow:0 0 0 4px rgba(10,132,255,0.18);}
input[type=password]::placeholder{color:var(--text3);}
/* Global Apple-style button feedback */
button{transition:transform .16s ease, opacity .16s ease, background .2s ease, box-shadow .2s ease;}
button:hover:not(:disabled){transform:translateY(-1px);}
button:active:not(:disabled){transform:scale(0.98);}
@supports (backdrop-filter:blur(20px)){.glass{backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);}}
/* Details */
details summary{list-style:none;cursor:pointer;}
details summary::-webkit-details-marker{display:none;}
/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}
.fade-up{animation:fadeUp .3s ease both;}
.pulse{animation:pulse 1.6s ease-in-out infinite;}
/* Utility */
.row-tap:active{opacity:0.6;transition:opacity .1s;}
</style>

<script>
// Show errors visibly instead of black screen
window.onerror = function(msg, src, line, col, err) {
  var r = document.getElementById('root');
  if (r) r.innerHTML = '<div style="padding:24px;font-family:-apple-system,sans-serif;background:#000;min-height:100vh"><div style="background:#ff453a22;border:1px solid #ff453a44;border-radius:14px;padding:20px;color:#ff453a"><div style="font-size:17px;font-weight:700;margin-bottom:8px">&#9888; JavaScript Fehler</div><div style="font-size:14px;margin-bottom:6px">' + msg + '</div><div style="font-size:12px;color:rgba(255,255,255,0.4);font-family:monospace">Zeile: ' + line + ' · ' + (src||'').split('/').pop() + '</div></div></div>';
};
// Detect if CDNs failed to load
window.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    if (!window.React) {
      document.getElementById('root').innerHTML = '<div style="padding:24px;color:#ff453a;font-family:-apple-system,sans-serif;background:#000;min-height:100vh"><h2>CDN Ladefehler</h2><p style="margin-top:8px;color:rgba(255,255,255,0.5)">React konnte nicht geladen werden. Bitte Internetverbindung pruefen und neu laden.</p></div>';
    }
  }, 5000);
});
</script>

// ── Module-level helper (used by both calcScore AND fetchFinnhubStock) ─
// ok(v): true if v is a valid finite number (excludes null/undefined/NaN)
// okz(v): same but also allows 0 — use for %, growth, performance values
const ok  = v => v !== null && v !== undefined && isFinite(v) && v !== 0;
const okz = v => v !== null && v !== undefined && isFinite(v);


// ── Levermann Scoring Engine ───────────────────────────────────────
// Pure, deterministic — no side effects, no network.
// Uses module-level ok/okz helpers.
function calcScore(d, sector) {
  const fin = FINANCE_SECTORS.includes(sector);
  const C13 = [];
  const add = (id,name,score,value,reasoning) => C13.push({id,name,score,value,reasoning});

  // 1. EK-Rendite (ROE as decimal: 0.20 = 20%)
  const roe = d.roe;
  if (!ok(roe))          add(1,"EK-Rendite", 0,"n/v","Keine Daten");
  else if (roe > 0.20)   add(1,"EK-Rendite", 1,(roe*100).toFixed(1)+"%",">20%");
  else if (roe >= 0.10)  add(1,"EK-Rendite", 0,(roe*100).toFixed(1)+"%","10-20%");
  else                   add(1,"EK-Rendite",-1,(roe*100).toFixed(1)+"%","<10%");

  // 2. EBIT-Marge (as decimal)
  const em = d.ebitMargin;
  if (fin)               add(2,"EBIT-Marge", 0,"n/a","Finanzsektor");
  else if (!okz(em))     add(2,"EBIT-Marge", 0,"n/v","Keine Daten");
  else if (em > 0.12)    add(2,"EBIT-Marge", 1,(em*100).toFixed(1)+"%",">12%");
  else if (em >= 0.06)   add(2,"EBIT-Marge", 0,(em*100).toFixed(1)+"%","6-12%");
  else                   add(2,"EBIT-Marge",-1,(em*100).toFixed(1)+"%","<6%");

  // 3. EK-Quote (as decimal)
  const eq = d.equityRatio;
  if (!okz(eq))          add(3,"EK-Quote", 0,"n/v","Keine Daten");
  else if (fin) {
    if (eq > 0.10)       add(3,"EK-Quote", 1,(eq*100).toFixed(1)+"%",">10% (Bank)");
    else if (eq >= 0.05) add(3,"EK-Quote", 0,(eq*100).toFixed(1)+"%","5-10% (Bank)");
    else                 add(3,"EK-Quote",-1,(eq*100).toFixed(1)+"%","<5% (Bank)");
  } else {
    if (eq > 0.25)       add(3,"EK-Quote", 1,(eq*100).toFixed(1)+"%",">25%");
    else if (eq >= 0.15) add(3,"EK-Quote", 0,(eq*100).toFixed(1)+"%","15-25%");
    else                 add(3,"EK-Quote",-1,(eq*100).toFixed(1)+"%","<15%");
  }

  // 4. KGV 5J
  const p5 = d.pe5yAvg;
  if (!ok(p5)||p5<=0)    add(4,"KGV 5J", 0,"n/v","Keine Daten");
  else if (p5 < 12)      add(4,"KGV 5J", 1,p5.toFixed(1),"<12 günstig");
  else if (p5 <= 16)     add(4,"KGV 5J", 0,p5.toFixed(1),"12-16 fair");
  else                   add(4,"KGV 5J",-1,p5.toFixed(1),">16 teuer");

  // 5. KGV aktuell
  const pe = d.pe;
  if (!ok(pe)||pe<=0)    add(5,"KGV akt.", 0,"n/v","Keine Daten");
  else if (pe < 12)      add(5,"KGV akt.", 1,pe.toFixed(1),"<12 günstig");
  else if (pe <= 16)     add(5,"KGV akt.", 0,pe.toFixed(1),"12-16 fair");
  else                   add(5,"KGV akt.",-1,pe.toFixed(1),">16 teuer");

  // 6. Analysten — KONTRAINDIKATOR
  const buy = d.analystBuyPct;
  if (!okz(buy))         add(6,"Analysten", 0,"n/v","Keine Daten");
  else if (buy > 70)     add(6,"Analysten",-1,buy.toFixed(0)+"%","Kontra: >70% bullisch");
  else if (buy >= 50)    add(6,"Analysten", 0,buy.toFixed(0)+"%","Gemischt");
  else                   add(6,"Analysten", 1,buy.toFixed(0)+"%","Kontra: mehrh. bearisch");

  // 7. Quartalsreaktion
  const qr = d.earningsReactionPct;
  if (!okz(qr))          add(7,"Quartalsreak.", 0,"n/v","Keine Daten");
  else if (qr > 1)       add(7,"Quartalsreak.", 1,qr.toFixed(1)+"%","Positiv");
  else if (qr >= -1)     add(7,"Quartalsreak.", 0,qr.toFixed(1)+"%","Neutral");
  else                   add(7,"Quartalsreak.",-1,qr.toFixed(1)+"%","Negativ");

  // 8. Gewinnrevision (Finnhub: epsRevision4w; static: null → 0/n/v)
  const rev = d.epsRevision4w;
  if (!okz(rev))         add(8,"Gewinnrevision", 0,"n/v","Keine Daten");
  else if (rev > 1)      add(8,"Gewinnrevision", 1,(rev>0?"+":"")+rev.toFixed(1)+"%","Aufwärts");
  else if (rev >= -1)    add(8,"Gewinnrevision", 0,(rev>0?"+":"")+rev.toFixed(1)+"%","Stabil");
  else                   add(8,"Gewinnrevision",-1,rev.toFixed(1)+"%","Abwärts");

  // 9. Kurs 6M (%)
  const p6 = d.perf6m;
  if (!okz(p6))          add(9,"Kurs 6M", 0,"n/v","Keine Daten");
  else if (p6 > 5)       add(9,"Kurs 6M", 1,(p6>0?"+":"")+p6.toFixed(1)+"%","Stark >5%");
  else if (p6 >= -5)     add(9,"Kurs 6M", 0,(p6>0?"+":"")+p6.toFixed(1)+"%","Seitwärts");
  else                   add(9,"Kurs 6M",-1,p6.toFixed(1)+"%","Schwach <-5%");

  // 10. Kurs 1J (%)
  const p12 = d.perf12m;
  if (!okz(p12))         add(10,"Kurs 1J", 0,"n/v","Keine Daten");
  else if (p12 > 5)      add(10,"Kurs 1J", 1,(p12>0?"+":"")+p12.toFixed(1)+"%","Stark >5%");
  else if (p12 >= -5)    add(10,"Kurs 1J", 0,(p12>0?"+":"")+p12.toFixed(1)+"%","Seitwärts");
  else                   add(10,"Kurs 1J",-1,p12.toFixed(1)+"%","Schwach <-5%");

  // 11. Momentum (6M vs 1J)
  if (!okz(p6) || !okz(p12)) add(11,"Momentum", 0,"n/v","Keine Daten");
  else if (p6 > p12)          add(11,"Momentum", 1,"6M>1J","Beschleunigend");
  else                        add(11,"Momentum",-1,"6M<=1J","Abbremsend");

  // 12. Gewinnwachstum YoY (%)
  const eg = d.epsGrowthYoY;
  if (!okz(eg))          add(12,"Gewinnwachstum", 0,"n/v","Keine Daten");
  else if (eg > 0.5)     add(12,"Gewinnwachstum", 1,"+"+eg.toFixed(1)+"%","Wachstum");
  else if (eg >= -0.5)   add(12,"Gewinnwachstum", 0,eg.toFixed(1)+"%","Unverändert");
  else                   add(12,"Gewinnwachstum",-1,eg.toFixed(1)+"%","Rückgang");

  // 13. Kurspotenzial (Analystenziel vs. Kurs)
  const up = d.analystTargetUpside;
  if (!okz(up))          add(13,"Kurspotenzial", 0,"n/v","Keine Daten");
  else if (up > 15)      add(13,"Kurspotenzial", 1,(up>0?"+":"")+up.toFixed(1)+"%",">15%");
  else if (up >= 0)      add(13,"Kurspotenzial", 0,(up>0?"+":"")+up.toFixed(1)+"%","0-15%");
  else                   add(13,"Kurspotenzial",-1,up.toFixed(1)+"%","Negativ");

  const total = C13.reduce((s,c) => s+c.score, 0);
  const rec   = total>=4?"KAUFEN":total<=2?"VERKAUFEN":"HALTEN";
  const comp  = Math.round(C13.filter(c=>c.value!=="n/v"&&c.value!=="n/a").length/13*100);
  return { criteria:C13, totalScore:total, recommendation:rec, dataCompleteness:comp };
}


// ── Finnhub Direct Client ──────────────────────────────────────────
// Works in deployed PWA (Safari/Chrome without sandbox).
// Finnhub free plan: 60 req/min. We do 4 sequential req/stock + delays.
const FH_CACHE = new Map();

async function fhGet(path, key) {
  const url = "https://finnhub.io/api/v1/" + path + "&token=" + key;
  const hit = FH_CACHE.get(url);
  if (hit && Date.now() - hit.ts < CACHE_TTL_MS) return hit.data;

  let resp;
  try {
    resp = await fetch(url, {method:"GET", mode:"cors", credentials:"omit",
      headers:{"Accept":"application/json"}});
  } catch(e) {
    throw new Error("Netzwerk: " + e.message + " (CORS/Verbindung)");
  }

  if (resp.status === 401 || resp.status === 403)
    throw new Error("API Key ungültig (" + resp.status + ") — Key prüfen");
  if (resp.status === 429)
    throw new Error("Rate Limit (429) — 60s warten");
  if (!resp.ok) throw new Error("Finnhub HTTP " + resp.status);

  // Read text first — resp.json() throws "pattern" error on empty body in Safari
  let text;
  try { text = await resp.text(); } catch(e) { throw new Error("Response lesen: " + e.message); }
  if (!text || text.trim() === "") return {};

  // KEY FIX: Detect HTML rate-limit page (Finnhub returns 200 + HTML instead of JSON)
  // This happens when too many requests fire too fast on the free plan.
  // Return marker instead of throwing so safeFhGet handles it gracefully.
  if (text.trim().charAt(0) === "<") {
    return { _rateLimitHtml: true };
  }

  let data;
  try { data = JSON.parse(text); } catch(e) {
    throw new Error("JSON: " + text.slice(0, 40));
  }
  // Finnhub returns {"error":"..."} for invalid symbols — treat as empty
  if (data && data.error) return {};

  FH_CACHE.set(url, {data, ts: Date.now()});
  return data;
}

async function fetchFinnhubStock(stock, key) {
  const t = stock.ticker;

  // Track errors and rate-limit hits per endpoint
  const endpointErrors  = [];
  let   rateLimitCount  = 0;

  // safeFhGet: catches errors AND handles HTML rate-limit pages gracefully
  async function safeFhGet(label, path) {
    try {
      const data = await fhGet(path, key);
      if (data && data._rateLimitHtml) {
        // Finnhub returned HTML = rate-limit page
        rateLimitCount++;
        endpointErrors.push(label + ": Rate-Limit (HTML)");
        return {};
      }
      return data || {};
    } catch(e) {
      endpointErrors.push(label + ": " + e.message);
      return {};
    }
  }

  // Sequential requests — 600ms between each to stay under 60req/min free plan
  // 4 endpoints × 600ms = ~2.4s per stock, very safe for rate limits
  const metrics = await safeFhGet("metric", "stock/metric?symbol="+t+"&metric=all");
  await new Promise(r => setTimeout(r, 600));
  const recs    = await safeFhGet("recs",   "recommendation?symbol="+t);
  await new Promise(r => setTimeout(r, 600));
  const quote   = await safeFhGet("quote",  "quote?symbol="+t);
  await new Promise(r => setTimeout(r, 600));
  const target  = await safeFhGet("target", "price-target?symbol="+t);

  // Only throw (→ retry → fallback) if ALL 4 were hard errors (not rate-limit HTML)
  // Rate-limit → return partial data marked as LIVE so user sees the issue
  const hardErrors = endpointErrors.filter(e => !e.includes("Rate-Limit"));
  if (hardErrors.length === 4) {
    throw new Error("Alle Endpoints: " + hardErrors[0]);
  }

  const m = (metrics && metrics.metric) ? metrics.metric : {};

  // ROE
  let roe = ok(m.roeTTM) ? m.roeTTM/100 : null;
  if (roe !== null && (roe > 5 || roe < -2)) roe = null;

  // EBIT margin
  let ebitMargin = null;
  if (ok(m.ebitdMarginTTM))          ebitMargin = m.ebitdMarginTTM/100;
  else if (ok(m.netProfitMarginTTM)) ebitMargin = m.netProfitMarginTTM/100;

  // Equity ratio
  let equityRatio = null;
  if (okz(m.totalDebt2TotalEquityAnnual) && m.totalDebt2TotalEquityAnnual >= 0)
    equityRatio = 1/(1 + m.totalDebt2TotalEquityAnnual);

  // P/E
  let pe      = (ok(m.peTTM) && m.peTTM>0 && m.peTTM<2000) ? m.peTTM : null;
  let pe5yAvg = (ok(m.peBasicExclExtraTTM) && m.peBasicExclExtraTTM>0) ? m.peBasicExclExtraTTM : pe;

  // Analyst buy %
  let analystBuyPct = null;
  if (Array.isArray(recs) && recs.length > 0) {
    const r = recs[0];
    const tot = (r.strongBuy||0)+(r.buy||0)+(r.hold||0)+(r.sell||0)+(r.strongSell||0);
    if (tot > 0) analystBuyPct = ((r.strongBuy||0)+(r.buy||0))/tot*100;
  }

  // Price performance — okz allows 0%
  const perf6m       = okz(m["26WeekPriceReturnDaily"]) ? m["26WeekPriceReturnDaily"] : null;
  const perf12m      = okz(m["52WeekPriceReturnDaily"])  ? m["52WeekPriceReturnDaily"]  : null;
  const epsGrowthYoY = okz(m.epsGrowthTTMYoy)           ? m.epsGrowthTTMYoy            : null;

  // Current price + target upside
  const currentPrice = (quote && ok(quote.c) && quote.c > 0) ? quote.c : null;
  let analystTargetUpside = null;
  if (target && ok(target.targetMean) && currentPrice) {
    analystTargetUpside = (target.targetMean - currentPrice) / currentPrice * 100;
    if (Math.abs(analystTargetUpside) > 200) analystTargetUpside = null;
  }

  // Earnings reaction
  let earningsReactionPct = null;
  if (okz(m.epsActual) && ok(m.epsEstimate)) {
    const s = (m.epsActual - m.epsEstimate) / Math.abs(m.epsEstimate) * 100;
    if (Math.abs(s) <= 100) earningsReactionPct = s;
  }

  // EPS revision proxy
  const epsRevision4w = okz(m.epsGrowth3Y) ? m.epsGrowth3Y : null;

  // Currency from ticker suffix
  const currency =
    t.endsWith(".SW")?"CHF": t.endsWith(".L")?"GBP":
    [".PA",".DE",".MI",".MC",".AS",".BR",".HE",".ST",".CO"].some(s=>t.endsWith(s))?"EUR":
    t.endsWith(".T")?"JPY": t.endsWith(".AX")?"AUD": t.endsWith(".KS")?"KRW":
    t.endsWith(".TW")?"TWD": "USD";

  return {
    roe, ebitMargin, equityRatio, pe, pe5yAvg, analystBuyPct,
    earningsReactionPct, epsRevision4w, perf6m, perf12m, epsGrowthYoY,
    analystTargetUpside, currentPrice, currency,
    _usedFallback: false,
    // Store partial errors so user can see which endpoints had issues
    _endpointErrors: endpointErrors.length > 0 ? endpointErrors.join(" | ") : null,
  };
}

async function fetchWithRetry(stock, key) {
  let lastErr;
  for (let i=0; i<=MAX_RETRIES; i++) {
    try { return await fetchFinnhubStock(stock, key); }
    catch(e) {
      lastErr = e;
      // Don't retry auth/rate errors
      if (e.message.includes("401")||e.message.includes("403")||e.message.includes("429")) break;
      if (i < MAX_RETRIES) await new Promise(r=>setTimeout(r, RETRY_DELAY_MS*(i+1)));
    }
  }
  // Static fallback — only reached when ALL 4 endpoints fail AND retry exhausted
  const staticEntry = STATIC_STOCK_DATA.find(s => s.ticker === stock.ticker);
  if (staticEntry) return {
    ...staticEntry,
    _usedFallback: true,
    _fallbackReason: lastErr ? lastErr.message : "Alle Endpoints fehlgeschlagen",
  };
  throw lastErr;
}

const EU_FLAGS = ["🇩🇪","🇫🇷","🇬🇧","🇨🇭","🇳🇱","🇮🇹","🇪🇸","🇫🇮","🇸🇪","🇩🇰","🇧🇪","🇦🇹","🇵🇹","🇳🇴"];
const REGIONS  = ["Alle","🇺🇸 USA","🇪🇺 Europa","🇯🇵 Japan","🇨🇳 China","🇮🇳 Indien","🇦🇺 Ozeanien","Andere"];

function regionMatch(s, f) {
  if (f==="Alle") return true;
  if (f==="🇺🇸 USA") return s.region==="🇺🇸";
  if (f==="🇪🇺 Europa") return EU_FLAGS.includes(s.region);
  if (f==="🇯🇵 Japan") return s.region==="🇯🇵";
  if (f==="🇨🇳 China") return s.region==="🇨🇳";
  if (f==="🇮🇳 Indien") return s.region==="🇮🇳";
  if (f==="🇦🇺 Ozeanien") return ["🇦🇺","🇳🇿"].includes(s.region);
  return !["🇺🇸",...EU_FLAGS,"🇯🇵","🇨🇳","🇮🇳","🇦🇺","🇳🇿"].includes(s.region);
}

// ── CSV Export ─────────────────────────────────────────────────────
function exportCSV(rows, name) {
  const csv = rows.map(r =>
    r.map(v => '"'+String((v !== null && v !== undefined ? v : "")).replace(/"/g,'""')+'"').join(",")
  ).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
  a.download = name; a.click();
}

// Connection test panel
async function testFinnhubConnection(key) {
  const url = "https://finnhub.io/api/v1/quote?symbol=AAPL&token="+key;
  let resp;
  try {
    resp = await fetch(url,{method:"GET",mode:"cors",credentials:"omit",headers:{"Accept":"application/json"}});
  } catch(e) {
    return {ok:false,msg:"Netzwerkfehler: "+e.message,raw:null};
  }
  if (resp.status===401||resp.status===403)
    return {ok:false,msg:"API Key ungültig ("+resp.status+")",raw:null};
  if (resp.status===429)
    return {ok:false,msg:"Rate Limit (429) — 60s warten",raw:null};
  if (!resp.ok) return {ok:false,msg:"HTTP "+resp.status,raw:null};
  let text="";
  try{text=await resp.text();}catch(e){}
  if (text.trim().charAt(0)==="<")
    return {ok:false,msg:"HTML-Antwort (Rate-Limit?)",raw:text.slice(0,60)};
  let data;
  try{data=JSON.parse(text);}catch(e){return {ok:false,msg:"Kein JSON",raw:text.slice(0,60)};}
  if (!data||!data.c||data.c<=0)
    return {ok:false,msg:"Ungültige Daten",raw:text.slice(0,60)};
  return {ok:true,msg:"Verbindung OK · AAPL: $"+data.c.toFixed(2),raw:null};
}

function ConnTestPanel({apiKey, onResult}) {
  const [state,  setState]  = useState("idle");
  const [result, setResult] = useState(null);
  const [prevKey,setPrevKey]= useState("");

  useEffect(()=>{
    if (!apiKey||apiKey.length<8){setState("idle");setResult(null);onResult(false);return;}
    if (apiKey===prevKey) return;
    const t = setTimeout(async()=>{
      setState("loading");
      const res = await testFinnhubConnection(apiKey);
      setState(res.ok?"ok":"fail");
      setResult(res);
      setPrevKey(apiKey);
      onResult(res.ok);
    },800);
    return ()=>clearTimeout(t);
  },[apiKey]);

  async function retest(){
    setState("loading");setResult(null);
    const res = await testFinnhubConnection(apiKey);
    setState(res.ok?"ok":"fail");
    setResult(res);
    setPrevKey(apiKey);
    onResult(res.ok);
  }

  const col = state==="ok"?A.green:state==="fail"?A.red:A.t3;
  const icon= state==="ok"?"✅":state==="fail"?"❌":state==="loading"?"⏳":"🔌";

  return (
    <div style={{
      marginTop:12,padding:"12px 14px",borderRadius:12,
      background:state==="ok"?A.greenBg:state==="fail"?A.redBg:"rgba(255,255,255,0.04)",
      border:"1px solid "+(state==="ok"?A.green+"33":state==="fail"?A.red+"33":A.sep),
      transition:"all .3s",
    }}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:18}}>{icon}</span>
        <div style={{flex:1,fontSize:13,fontWeight:state!=="idle"?600:400,color:col}}>
          {state==="idle"&&"Verbindungstest startet automatisch…"}
          {state==="loading"&&<span className="pulse">Teste Finnhub-Verbindung…</span>}
          {state==="ok" && result && result.msg}
            {state==="fail" && result && result.msg}
        </div>
        <GhostBtn onClick={retest} color={A.blue}>
          {state==="loading"?"…":"Testen"}
        </GhostBtn>
      </div>
      {result && result.raw && (
        <div style={{
          marginTop:8,fontSize:11,color:A.t3,fontFamily:A.mono,
          wordBreak:"break-all",lineHeight:1.5,
        }}>{result.raw}</div>
      )}
    </div>
  );
}

function ReportTab({results, mode}) {
  const [sort,  setSort]  = useState("score");
  const [filter,setFilter]= useState("ALLE");

  const sorted = useMemo(()=>[...results]
    .filter(r=>filter==="ALLE"||r.recommendation===filter)
    .sort((a,b)=>{
      if(sort==="name") return a.name.localeCompare(b.name);
      if(sort==="rating"){
        const o=["KAUFEN","HALTEN","VERKAUFEN"];
        return o.indexOf(a.recommendation)-o.indexOf(b.recommendation);
      }
      return b.totalScore-a.totalScore;
    }),[results,filter,sort]);

  const stats = useMemo(()=>({
    total:results.length,
    kaufen:results.filter(r=>r.recommendation==="KAUFEN").length,
    halten:results.filter(r=>r.recommendation==="HALTEN").length,
    vk:results.filter(r=>r.recommendation==="VERKAUFEN").length,
    live:results.filter(r=>r._usedFallback===false).length,
    avg:results.length>0
      ?(results.reduce((s,r)=>s+(r.totalScore||0),0)/results.length).toFixed(1)

        {sorted.map((s,i)=>(

            display:"grid",gridTemplateColumns:RPT_GRID,
            padding:"11px 16px",gap:4,alignItems:"center",
            borderBottom:"1px solid "+A.sep2,
            background:i%2===0?"transparent":"rgba(255,255,255,0.015)",
          }}>
            <div style={{
              fontSize:11,fontWeight:700,fontFamily:A.mono,
              color:i<3?A.blue:A.t3,
            }}>{i+1}</div>
            <div>
              <div style={{
                display:"flex",alignItems:"center",gap:5,
                fontSize:13,fontWeight:600,lineHeight:1.2,
              }}>
                <span style={{fontSize:12}}>{s.region}</span>
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {s.name}
                </span>
              </div>
              <div style={{fontSize:10,color:A.t3,fontFamily:A.mono,marginTop:1}}>
                {s.ticker}
              </div>
            </div>
            <div style={{textAlign:"center"}}>
              <span style={{
                fontSize:10,fontWeight:600,fontFamily:A.mono,
                color:WKN[s.ticker]?A.t1:A.t3,
                background:WKN[s.ticker]?"rgba(255,255,255,0.08)":"transparent",
                padding:"2px 6px",borderRadius:6,
              }}>{WKN[s.ticker]||"—"}</span>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{
                fontSize:15,fontWeight:700,fontFamily:A.mono,
                color:scoreCol(s.totalScore),lineHeight:1,marginBottom:3,
              }}>{fmtS(s.totalScore)}</div>
              <CritDots criteria={s.criteria}/>
            </div>
            <div style={{textAlign:"center"}}>
              <DataPct pct={s.dataCompleteness||0}/>
            </div>
            <div style={{textAlign:"center"}}>
              {s.currentPrice!=null?(
                <div>
                  <div style={{fontSize:11,fontWeight:600,fontFamily:A.mono}}>
                    {s.currentPrice.toFixed(2)}
                  </div>
                  <div style={{fontSize:9,color:A.t3}}>{s.currency||""}</div>
                </div>
              ):<span style={{color:A.t3,fontSize:11}}>—</span>}
            </div>
            <div style={{textAlign:"center"}}>
              <SrcBadge stock={s} mode={mode}/>
            </div>
            <div style={{textAlign:"center"}}>
              <RecPill rec={s.recommendation} size={9}/>
            </div>
          </div>
        ))}

        <div style={{padding:"12px 16px",textAlign:"center",fontSize:12,color:A.t3,lineHeight:1.5}}>
          {sorted.length} Aktien · {new Date().toLocaleDateString("de-DE")} · Keine Anlageberatung
        </div>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────
function App() {
  const [mode,     setMode]     = useState(MODES.STATIC);
  const [apiKey,   setApiKey]   = useState("");
  const [connOk,   setConnOk]   = useState(false);
  const [count,    setCount]    = useState(50);
  const [running,  setRunning]  = useState(false);
  const [results,  setResults]  = useState([]);
  const [errors,   setErrors]   = useState([]);
  const [progress, setProgress] = useState(0);
  const [curTick,  setCurTick]  = useState("");
  const [done,     setDone]     = useState(false);
  const [tab,      setTab]      = useState("scanner");

  const abortRef = useRef(false);
  const resRef   = useRef([]);
  const errRef   = useRef([]);
  const maxN     = Math.min(count, STATIC_STOCK_DATA.length);

  const runStatic = useCallback(()=>{
    const data=STATIC_STOCK_DATA.slice(0,maxN).map(s=>({
      ...s,...calcScore(s,s.sector),_usedFallback:false,
    }));
    setResults(data);setErrors([]);setProgress(100);setDone(true);
  },[maxN]);

  const runFinnhub = useCallback(async()=>{
    if(!apiKey.trim()||!connOk) return;
    abortRef.current=false;resRef.current=[];errRef.current=[];
    setRunning(true);setDone(false);setResults([]);setErrors([]);setProgress(0);
    const batch=STATIC_STOCK_DATA.slice(0,maxN);
    let done_=0;
    await new Promise(r=>setTimeout(r,2000));
    for(let i=0;i<batch.length;i+=CONCURRENCY){
      if(abortRef.current) break;
      const chunk=batch.slice(i,i+CONCURRENCY);
      setCurTick(chunk.map(s=>s.ticker).join(", "));
      const settled=await Promise.allSettled(chunk.map(async s=>{
        const raw=await fetchWithRetry(s,apiKey);
        return {...s,...raw,...calcScore(raw,s.sector)};
      }));
      settled.forEach((r,idx)=>{
        if(r.status==="fulfilled"){
          resRef.current=[...resRef.current,r.value];
          setResults([...resRef.current]);
        } else {
          errRef.current=[...errRef.current,{...chunk[idx],error:(r.reason && r.reason.message ? r.reason.message : "Fehler")}];
          setErrors([...errRef.current]);
        }
      });
      done_+=chunk.length;
      setProgress(Math.round(done_/batch.length*100));
      if(i+CONCURRENCY<batch.length) await new Promise(r=>setTimeout(r,BATCH_DELAY_MS));
    }
    setRunning(false);setDone(true);setCurTick("");
  },[apiKey,connOk,maxN]);

  const estMin = Math.ceil(maxN*3.6/60);
  const estSec = Math.round(maxN*3.6);

  const canStart = mode===MODES.STATIC || (!!apiKey && connOk);

  const TABS=[
    {id:"scanner",label:"Scanner",icon:"⚡"},
    {id:"report", label:"Ergebnisse"+(results.length>0?" ("+results.length+")":""),icon:"📋"},
  ];

  return (
    <div style={{
      minHeight:"100vh",background:"transparent",color:A.t1,fontFamily:A.font,
      paddingTop:"env(safe-area-inset-top,0px)",
    }}>

      {/* Header — Apple Navigation Bar style */}
      <div style={{
        background:"rgba(6,7,11,0.72)",
        backdropFilter:"saturate(180%) blur(28px)",
        WebkitBackdropFilter:"saturate(180%) blur(28px)",
        borderBottom:"0.5px solid rgba(255,255,255,0.12)",
        boxShadow:"0 10px 30px rgba(0,0,0,0.22)",
        padding:"18px 20px 16px",position:"sticky",top:0,zIndex:100,
      }}>
        <div style={{maxWidth:860,margin:"0 auto"}}>
          <div style={{
            fontSize:11,fontWeight:600,color:A.blue,
            textTransform:"uppercase",letterSpacing:"0.8px",
            marginBottom:4,
          }}>MSCI ACWI · Levermann v5.1</div>
          <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between"}}>
            <h1 style={{
              fontSize:32,fontWeight:800,letterSpacing:"-0.8px",lineHeight:1,
            }}>
              Top‑30 <span style={{color:A.blue}}>Screening</span>
            </h1>
            <div style={{fontSize:12,color:A.t3,marginBottom:2}}>
              {STATIC_STOCK_DATA.length} Aktien
            </div>
          </div>
        </div>
      </div>

      {/* Tab bar — Apple style */}
      <div style={{
        background:"rgba(6,7,11,0.58)",
        backdropFilter:"saturate(180%) blur(24px)",WebkitBackdropFilter:"saturate(180%) blur(24px)",
        borderBottom:"0.5px solid rgba(255,255,255,0.08)",
        padding:"0 20px",position:"sticky",top:64,zIndex:99,
      }}>
        <div style={{maxWidth:860,margin:"0 auto",display:"flex",gap:24}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              display:"flex",alignItems:"center",gap:6,
              padding:"12px 0",background:"transparent",border:"none",
              borderBottom:"2px solid "+(tab===t.id?A.blue:"transparent"),
              color:tab===t.id?A.blue:A.t3,
              fontWeight:tab===t.id?600:400,fontSize:15,
              cursor:"pointer",fontFamily:A.font,transition:"all .2s",
              letterSpacing:"-0.1px",
            }}>
              <span style={{fontSize:14}}>{t.icon}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:960,margin:"0 auto",padding:"24px 18px 56px"}}>

        {tab==="scanner" && (
          <div className="fade-up">

            {/* Mode selector */}
            <Card>
              <div style={{fontSize:13,fontWeight:600,color:A.t3,marginBottom:10,
                textTransform:"uppercase",letterSpacing:"0.5px"}}>
                Datenquelle
              </div>
              <SegmentedControl
                options={[
                  {id:MODES.STATIC,  icon:"⚡", label:"Statisch"},
                  {id:MODES.FINNHUB, icon:"📡", label:"Finnhub Live"},
                ]}
                value={mode}
                onChange={m=>{setMode(m);setConnOk(false);}}
              />
              <div style={{
                marginTop:12,fontSize:13,color:A.t3,lineHeight:1.5,
              }}>
                {mode===MODES.STATIC
                  ? "Vorberechnete Daten aus KI-Trainingswissen (~Anfang 2025). Kein Key nötig, startet sofort."
                  : "Echte Finanzdaten via Finnhub REST API. Kostenloser Key erforderlich. Nur als deployed PWA."}
              </div>
            </Card>

            {/* Finnhub Key */}
            {mode===MODES.FINNHUB && (
              <Card style={{
                border:"1px solid "+(connOk?A.green+"44":!apiKey?A.sep:"rgba(255,255,255,0.05)"),
                transition:"border-color .3s",
              }}>
                <div style={{fontSize:13,fontWeight:600,color:A.t3,marginBottom:10,
                  textTransform:"uppercase",letterSpacing:"0.5px"}}>
                  🔑 Finnhub API Key
                </div>
                <input type="password"
                  placeholder="Key von finnhub.io"
                  value={apiKey}
                  onChange={e=>{setApiKey(e.target.value);setConnOk(false);}}
                />
                <div style={{
                  marginTop:10,fontSize:13,color:A.t3,lineHeight:1.6,
                }}>
                  <a href="https://finnhub.io" style={{color:A.blue,textDecoration:"none"}}>
                    finnhub.io
                  </a>
                  {" "}→ Registrieren → Dashboard → API Key kopieren
                </div>
                <ConnTestPanel apiKey={apiKey} onResult={ok=>setConnOk(ok)}/>
              </Card>
            )}

            {/* Slider */}
            <Card>
              <div style={{
                display:"flex",justifyContent:"space-between",
                alignItems:"baseline",marginBottom:16,
              }}>
                <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                  <span style={{
                    fontSize:40,fontWeight:700,fontFamily:A.mono,
                    color:A.t1,letterSpacing:"-1px",lineHeight:1,
                  }}>{maxN}</span>
                  <span style={{fontSize:17,color:A.t3}}>Aktien</span>
                </div>
                <div style={{textAlign:"right"}}>
                  {mode===MODES.STATIC ? (
                    <span style={{
                      fontSize:13,color:A.green,fontWeight:600,
                      background:A.greenBg,padding:"4px 10px",borderRadius:100,
                    }}>⚡ Sofort</span>
                  ) : (
                    <span style={{fontSize:13,color:A.t3}}>
                      ~{estMin} Min. / {estSec}s
                    </span>
                  )}
                </div>
              </div>

              <input type="range" min={10} max={STATIC_STOCK_DATA.length}
                step={5} value={count}
                onChange={e=>setCount(+e.target.value)}
                disabled={running}/>

              <div style={{
                display:"flex",justifyContent:"space-between",
                marginTop:8,
              }}>
                {[10,25,50,75,100].map(v=>(
                  <span key={v} onClick={()=>!running&&setCount(v)} style={{
                    fontSize:12,fontFamily:A.mono,cursor:"pointer",
                    color:v===count?A.blue:A.t3,
                    fontWeight:v===count?700:400,
                    transition:"color .15s",
                  }}>{v}</span>
                ))}
              </div>
            </Card>

            {/* Action buttons */}
            <div style={{display:"flex",gap:10,marginBottom:12}}>
              <div style={{flex:1}}>
                <PrimaryBtn
                  onClick={mode===MODES.STATIC?runStatic:runFinnhub}
                  disabled={running||!canStart}
                >
                  {running
                    ? "Analysiere… ("+progress+"%)"
                    : done
                      ? "Erneut analysieren"
                      : !canStart&&mode===MODES.FINNHUB
                        ? "Verbindung prüfen ↑"
                        : maxN+" Aktien analysieren"}
                </PrimaryBtn>
              </div>
              {running && (
                <PrimaryBtn
                  danger
                  onClick={()=>{abortRef.current=true;setRunning(false);setDone(true);}}
                >
                  Stop
                </PrimaryBtn>
              )}
            </div>

            {/* Progress */}
            {running && (
              <Card pad="14px 16px">
                <div style={{
                  display:"flex",justifyContent:"space-between",
                  alignItems:"center",marginBottom:4,
                }}>
                  <span style={{
                    fontSize:13,fontWeight:600,
                    color:resRef.current.some(r=>r._endpointErrors&&
                      r._endpointErrors.includes("Rate-Limit"))
                      ?A.yellow:A.green,
                  }}>
                    {resRef.current.some(r=>r._endpointErrors&&
                      r._endpointErrors.includes("Rate-Limit"))
                      ?"⚠ Rate-Limit erkannt"
                      :"📡 Finnhub Live-Abruf"}
                    {" · "+resRef.current.filter(r=>r._usedFallback===false).length+" live"}
                    {" · "+resRef.current.filter(r=>r._usedFallback===true).length+" fallback"}
                  </span>
                  <span style={{
                    fontSize:13,fontWeight:700,fontFamily:A.mono,color:A.blue,
                  }}>{progress}%</span>
                </div>
                <div style={{
                  fontSize:13,color:A.t3,marginBottom:10,
                  animation:"pulse 1.5s ease-in-out infinite",
                }}>{curTick}</div>
                <div style={{height:4,background:"rgba(255,255,255,0.08)",borderRadius:2,overflow:"hidden"}}>
                  <div style={{
                    height:"100%",width:progress+"%",borderRadius:2,
                    background:"linear-gradient(90deg,"+A.blue+","+A.green+")",
                    transition:"width .3s ease",
                  }}/>
                </div>
                {errors.length>0&&(
                  <details style={{marginTop:10}}>
                    <summary style={{fontSize:12,color:A.red,fontWeight:500}}>
                      {errors.length} Fehler
                    </summary>
                    <div style={{
                      fontSize:11,color:A.t3,marginTop:6,fontFamily:A.mono,lineHeight:1.8,
                    }}>
                      {errors.map(e=>e.ticker+": "+e.error).join(" | ")}
                    </div>
                  </details>
                )}
              </Card>
            )}

            <ResultsTable results={results} mode={mode}/>

            {!running&&!done&&(
              <div style={{
                display:"flex",flexDirection:"column",
                alignItems:"center",justifyContent:"center",
                padding:"60px 24px",textAlign:"center",
              }}>
                <div style={{
                  width:80,height:80,borderRadius:24,
                  background:"linear-gradient(180deg,rgba(255,255,255,0.14),rgba(255,255,255,0.05))",display:"flex",alignItems:"center",
                  justifyContent:"center",fontSize:40,marginBottom:20,
                  border:"1px solid rgba(255,255,255,0.14)",boxShadow:"0 22px 50px rgba(0,0,0,0.30)",
                }}>🌍</div>
                <div style={{fontSize:22,fontWeight:600,marginBottom:8,letterSpacing:"-0.3px"}}>
                  ACWI Levermann Screening
                </div>
                <div style={{fontSize:15,color:A.t3,lineHeight:1.6,maxWidth:320}}>
                  Modus wählen, Anzahl einstellen und Analyse starten.
                </div>
              </div>
            )}
          </div>
        )}

        {tab==="report" && (
          <div className="fade-up">
            <ReportTab results={results} mode={mode}/>
          </div>
        )}

      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = {err:null}; }
  static getDerivedStateFromError(e) { return {err:e}; }
  render() {
    if (this.state.err) return (
      <div style={{padding:24,fontFamily:"-apple-system,sans-serif",background:"#000",minHeight:"100vh"}}>
        <div style={{background:"#ff453a22",border:"1px solid #ff453a44",borderRadius:14,padding:20,color:"#ff453a"}}>
          <div style={{fontSize:17,fontWeight:700,marginBottom:8}}>&#9888; Render Fehler</div>
          <div style={{fontSize:14,marginBottom:8}}>{this.state.err.message}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",fontFamily:"monospace",whiteSpace:"pre-wrap"}}>
            {(this.state.err.stack||"").slice(0,500)}
          </div>
        </div>
      </div>
    );
    return this.props.children;
  }
}

try {
  var boot = document.getElementById('boot');
  if (boot) boot.style.display = 'none';
  ReactDOM.createRoot(document.getElementById("root")).render(
    <ErrorBoundary><App/></ErrorBoundary>
  );
} catch(e) {
  var r = document.getElementById('root');
  if (r) r.innerHTML = '<div style="padding:24px;font-family:-apple-system,sans-serif;background:#000;min-height:100vh"><div style="background:#ff453a22;border:1px solid #ff453a44;border-radius:14px;padding:20px;color:#ff453a"><div style="font-size:17px;font-weight:700;margin-bottom:8px">&#9888; App Startfehler</div><div style="font-size:14px;margin-bottom:6px">' + e.message + '</div><div style="font-size:11px;color:rgba(255,255,255,0.4);font-family:monospace;white-space:pre-wrap;margin-top:8px">' + (e.stack||'').slice(0,400) + '</div></div></div>';
}
</script>
</body>

const WKN_PROFILE_TTL_MS = 30 * 24 * 60 * 60 * 1000;

function deriveWknFromIsin(isin) {
  const value = String(isin || "").trim().toUpperCase();
  return /^DE[A-Z0-9]{10}$/.test(value) ? value.slice(5, 11) : null;
}

function securityIdentity(ticker, isin) {
  const normalized = String(isin || "").trim().toUpperCase() || null;
  return { wkn: WKN_MAP[ticker] || deriveWknFromIsin(normalized), isin: normalized };
}

async function fetchSecurityIdentity(stock, key, signal) {
  const mapped = securityIdentity(stock.ticker, null);
  if (mapped.wkn || !key) return mapped;
  const path = "stock/profile2?symbol=" + encodeURIComponent(stock.ticker);
  const cacheKey = "fh:wkn:" + stock.ticker;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(cacheKey) || "null"); } catch(e) {}
  if (!cached || !cached.ts || Date.now() - cached.ts >= WKN_PROFILE_TTL_MS) {
    const profile = await fhGet(path, key, signal, WKN_PROFILE_TTL_MS);
    cached = { ts: Date.now(), data: profile || {} };
    try { localStorage.setItem(cacheKey, JSON.stringify(cached)); } catch(e) {}
  }
  const isin = cached && cached.data && cached.data.isin;
  return securityIdentity(stock.ticker, isin);
}

// ── Module-level constants ─────────────────────────────────────────
const QUOTE_TTL_MS = 60 * 1000;
const FUNDAMENTAL_TTL_MS = 24 * 60 * 60 * 1000;
const CONCURRENCY = 4;
const BATCH_DELAY_MS = 250;
const MAX_RETRIES = 3;
const RETRY_DELAY_MS = 900;
const REQUEST_TIMEOUT_MS = 12000;
const FINANCE_SECTORS = ["Finanzen","Versicherung"];

class TokenBucket {
  constructor(callsPerMinute=60, burst=30){this.rate=callsPerMinute/60000;this.capacity=Math.max(1,burst);this.tokens=this.capacity;this.at=Date.now();this.waiters=[];}
  take(signal){return new Promise((resolve,reject)=>{if(signal?.aborted)return reject(new DOMException("Abgebrochen","AbortError"));this.waiters.push({resolve,reject,signal});this.pump();});}
  pump(){const now=Date.now();this.tokens=Math.min(this.capacity,this.tokens+(now-this.at)*this.rate);this.at=now;const next=this.waiters[0];if(!next)return;if(next.signal?.aborted){this.waiters.shift();next.reject(new DOMException("Abgebrochen","AbortError"));return this.pump();}if(this.tokens>=1){this.tokens-=1;this.waiters.shift();next.resolve();return this.pump();}setTimeout(()=>this.pump(),Math.ceil((1-this.tokens)/this.rate));}
}
const RATE_BUCKET = new TokenBucket(FINNHUB_PLAN.free.callsPerMinute, FINNHUB_PLAN.free.burst);
const FH_CACHE = new Map();
const FH_INFLIGHT = new Map();

// ── Module-level helper (used by both calcScore AND fetchFinnhubStock) ─
// ok(v): true if v is a valid finite number (excludes null/undefined/NaN)
// okz(v): same but also allows 0 — use for %, growth, performance values
const ok  = v => v !== null && v !== undefined && isFinite(v) && v !== 0;
const okz = v => v !== null && v !== undefined && isFinite(v);


// ── Levermann Scoring Engine ───────────────────────────────────────
// Pure, deterministic — no side effects, no network.
// Uses module-level ok/okz helpers.
function calcScore(d, sector) {
  const fin = FINANCE_SECTORS.includes(sector);
  const large = d.capClass === "large";
  const C13 = [];
  const add = (id,name,score,value,reasoning,available=true) => C13.push({id,name,score,value,reasoning,available});
  const missing = (id,name,why) => add(id,name,0,"n/a",why,false);
  const pct = (v) => (v > 0 ? "+" : "") + v.toFixed(1) + "%";
  const band = (v, name, good, bad) => {
    if (!okz(v)) return missing(name.id,name.label,"Nicht verfügbar");
    return v > good ? add(name.id,name.label,1,pct(v),">"+good+"%") : v < bad ? add(name.id,name.label,-1,pct(v),"<"+bad+"%") : add(name.id,name.label,0,pct(v),bad+"–"+good+"%");
  };
  // 1–5: Levermann thresholds; percentages are decimal for 1–3.
  if (!okz(d.roe)) missing(1,"EK-Rendite","Nicht verfügbar"); else if(d.roe>0.20)add(1,"EK-Rendite",1,(d.roe*100).toFixed(1)+"%",">20%"); else if(d.roe>=0.10)add(1,"EK-Rendite",0,(d.roe*100).toFixed(1)+"%","10–20%"); else add(1,"EK-Rendite",-1,(d.roe*100).toFixed(1)+"%","<10%");
  if(fin) missing(2,"EBIT-Marge","Finanzwert: Kriterium nicht anwenden"); else if(!okz(d.ebitMargin)) missing(2,"EBIT-Marge","Nicht verfügbar"); else if(d.ebitMargin>0.12)add(2,"EBIT-Marge",1,(d.ebitMargin*100).toFixed(1)+"%",">12%"); else if(d.ebitMargin>=0.06)add(2,"EBIT-Marge",0,(d.ebitMargin*100).toFixed(1)+"%","6–12%"); else add(2,"EBIT-Marge",-1,(d.ebitMargin*100).toFixed(1)+"%","<6%");
  if(!okz(d.equityRatio)) missing(3,"EK-Quote","Nicht verfügbar"); else {const [hi,mid]=fin?[.10,.05]:[.25,.15]; add(3,"EK-Quote",d.equityRatio>hi?1:d.equityRatio>=mid?0:-1,(d.equityRatio*100).toFixed(1)+"%",fin?">10 / 5–10 / <5% (Finanzwert)":">25 / 15–25 / <15%");}
  if(!okz(d.pe5yAvg)||d.pe5yAvg<=0) missing(4,"KGV 5J","Nicht verfügbar: Finnhub liefert keinen belastbaren 5J-Durchschnitt"); else add(4,"KGV 5J",d.pe5yAvg<12?1:d.pe5yAvg<=16?0:-1,d.pe5yAvg.toFixed(1),d.pe5yAvg<12?"<12":d.pe5yAvg<=16?"12–16":">16");
  if(!okz(d.pe)||d.pe<=0) missing(5,"KGV aktuell","Nicht verfügbar"); else add(5,"KGV aktuell",d.pe<12?1:d.pe<=16?0:-1,d.pe.toFixed(1),d.pe<12?"<12":d.pe<=16?"12–16":">16");
  // 6: contrarian for large caps; small caps with <=5 analysts are direct.
  if(!okz(d.analystBuyPct)||!okz(d.analystSellPct)||!okz(d.analystCount)) missing(6,"Analystenmeinungen","Nicht verfügbar"); else {const direct=!large&&d.analystCount<=5; const score=direct?(d.analystBuyPct>d.analystSellPct?1:d.analystSellPct>d.analystBuyPct?-1:0):(d.analystSellPct>d.analystBuyPct?1:d.analystBuyPct>d.analystSellPct?-1:0); add(6,"Analystenmeinungen",score,d.analystCount+" Analysten",direct?"Small Cap ≤5: Kaufmehrheit +1":"Kontraindikator: Verkaufmehrheit +1");}
  // 7–8 require dedicated data; do not substitute EPS surprise for price reaction/revisions.
  if(!okz(d.earningsReactionPct)) missing(7,"Quartalsreaktion","Nicht verfügbar: Kurs-vs.-Index am Folgetag nicht berechenbar"); else add(7,"Quartalsreaktion",d.earningsReactionPct>1?1:d.earningsReactionPct<-1?-1:0,pct(d.earningsReactionPct),">+1 / <−1% vs. Index");
  if(!okz(d.epsRevision4w)) missing(8,"Gewinnrevisionen","Nicht verfügbar: 4-Wochen-EPS-Revision nicht geliefert"); else add(8,"Gewinnrevisionen",d.epsRevision4w>5?1:d.epsRevision4w<-5?-1:0,pct(d.epsRevision4w),">+5 / <−5%");
  if(!okz(d.perf6m)) missing(9,"Kurs heute vs 6M","Nicht verfügbar"); else add(9,"Kurs heute vs 6M",d.perf6m>5?1:d.perf6m<-5?-1:0,pct(d.perf6m),">+5 / <−5%");
  if(!okz(d.perf12m)) missing(10,"Kurs heute vs 12M","Nicht verfügbar"); else add(10,"Kurs heute vs 12M",d.perf12m>5?1:d.perf12m<-5?-1:0,pct(d.perf12m),">+5 / <−5%");
  if(!okz(d.perf6m)||!okz(d.perf12m)) missing(11,"Kursmomentum","Nicht verfügbar"); else add(11,"Kursmomentum",d.perf6m>5&&d.perf12m<=0?1:d.perf6m<-5&&d.perf12m>=0?-1:0,"6M "+pct(d.perf6m)+" / 12M "+pct(d.perf12m),"6M/12M-Regel");
  if(!large) missing(12,"Dreimonatsreversal","Nur Large Caps"); else if(!okz(d.reversal3m)) missing(12,"Dreimonatsreversal","Nicht verfügbar: Monatsrenditen vs. Index fehlen"); else add(12,"Dreimonatsreversal",d.reversal3m,"3M vs Index","3 aufeinanderfolgende Monate");
  if(!okz(d.epsGrowthNextVsCurrent)) missing(13,"Gewinnwachstum","Nicht verfügbar: nächstes-vs.-aktuelles EPS fehlt"); else add(13,"Gewinnwachstum",d.epsGrowthNextVsCurrent>5?1:d.epsGrowthNextVsCurrent<-5?-1:0,pct(d.epsGrowthNextVsCurrent),">+5 / <−5%");
  const total=C13.reduce((s,c)=>s+c.score,0), assessed=C13.filter(c=>c.available).length;
  const rec=large?(total>=4?"KAUFEN":total>=3?"HALTEN":"VERKAUFEN"):(total>=7?"KAUFEN":total>=5?"HALTEN":"VERKAUFEN");
  return {criteria:C13,totalScore:total,recommendation:rec,dataCompleteness:Math.round(assessed/13*100),assessedCount:assessed,capClass:large?"Large Cap":"Small/Mid Cap"};
}

// ── Finnhub Direct Client ──────────────────────────────────────────
// Primary source only; API errors are surfaced, never replaced with synthetic data.
function withTimeout(signal) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  if (signal) signal.addEventListener("abort", () => controller.abort(), {once:true});
  return {signal:controller.signal, clear:()=>clearTimeout(timer)};
}

async function fhGet(path, key, signal, customTtl) {
  const url = "https://finnhub.io/api/v1/" + path + "&token=" + key;
  const cacheKey = "fh:"+url;
  const ttl = customTtl || (/quote\?/.test(path) ? QUOTE_TTL_MS : FUNDAMENTAL_TTL_MS);
  let hit = FH_CACHE.get(url);
  try { const stored=JSON.parse(localStorage.getItem(cacheKey)||"null"); if(stored) hit=stored; } catch(e) {}
  if (hit && Date.now() - hit.ts < ttl) return hit.data;
  await RATE_BUCKET.take(signal);
  if (FH_INFLIGHT.has(url)) return FH_INFLIGHT.get(url);
  const pending = (async()=>{
    const ctl = withTimeout(signal);
    try {
      const resp = await fetch(url,{method:"GET",mode:"cors",credentials:"omit",signal:ctl.signal,headers:{"Accept":"application/json"}});
      if (resp.status===401||resp.status===403) throw new Error("API Key ungültig ("+resp.status+") — Key prüfen");
      if (resp.status===429) { const e=new Error("Rate Limit (429)"); e.retryable=true; throw e; }
      if (!resp.ok) throw new Error("Finnhub HTTP "+resp.status);
      const text=await resp.text();
      if (!text||!text.trim()) return {};
      if (text.trim().charAt(0)==="<") throw new Error("Unerwartete HTML-Antwort");
      const data=JSON.parse(text);
      if (data&&data.error) throw new Error("Finnhub: "+data.error);
      FH_CACHE.set(url,{data,ts:Date.now()}); try { localStorage.setItem(cacheKey,JSON.stringify({data,ts:Date.now()})); } catch(e) {}
      return data;
    } finally { ctl.clear(); FH_INFLIGHT.delete(url); }
  })();
  FH_INFLIGHT.set(url,pending);
  return pending;
}

async function fetchFinnhubStock(stock,key,signal) {
  const t=stock.ticker;
  const paths=[
    ["metric","stock/metric?symbol="+t+"&metric=all"],
    ["recs","recommendation?symbol="+t],
    ["quote","quote?symbol="+t],
    ["target","price-target?symbol="+t],
    ["earnings","stock/earnings?symbol="+t]
  ];
  const settled=await Promise.allSettled(paths.map(([,path])=>fhGet(path,key,signal)));
  if (signal && signal.aborted) throw new DOMException("Abgebrochen","AbortError");
  const failures=settled.filter(x=>x.status==="rejected");
  if (failures.length===settled.length) throw new Error(failures[0].reason?.message||"Alle Finnhub-Endpunkte fehlgeschlagen");
  const [metrics,recs,quote,target,earnings]=settled.map(x=>x.status==="fulfilled"?x.value:{});
  const identity = await fetchSecurityIdentity(stock, key, signal);
  const endpointErrors=failures.map((x,i)=>paths[i][0]+": "+(x.reason?.message||"Fehler")).join(" | ");
  const m=metrics?.metric||{};
  let roe=ok(m.roeTTM)?m.roeTTM/100:null; if(roe!==null&&(roe>5||roe<-2)) roe=null;
  let ebitMargin=ok(m.operatingMarginTTM)?m.operatingMarginTTM/100:null;
  let equityRatio=okz(m.totalDebt2TotalEquityAnnual)&&m.totalDebt2TotalEquityAnnual>=0?1/(1+m.totalDebt2TotalEquityAnnual):null;
  let pe=ok(m.peTTM)&&m.peTTM>0&&m.peTTM<2000?m.peTTM:null;
  let pe5yAvg=null;
  let analystBuyPct=null,analystSellPct=null,analystCount=null;
  if(Array.isArray(recs)&&recs.length){const r=recs[0],buy=(r.strongBuy||0)+(r.buy||0),sell=(r.sell||0)+(r.strongSell||0),tot=buy+(r.hold||0)+sell;if(tot){analystBuyPct=buy/tot*100;analystSellPct=sell/tot*100;analystCount=tot;}}
  const currentPrice=quote&&ok(quote.c)&&quote.c>0?quote.c:null;
  let analystTargetUpside=target&&ok(target.targetMean)&&currentPrice?(target.targetMean-currentPrice)/currentPrice*100:null;
  if(analystTargetUpside!==null&&Math.abs(analystTargetUpside)>200) analystTargetUpside=null;
  let earningsReactionPct=null;
  const currency=t.endsWith(".SW")?"CHF":t.endsWith(".L")?"GBP":[".PA",".DE",".MI",".MC",".AS",".BR",".HE",".ST",".CO"].some(x=>t.endsWith(x))?"EUR":t.endsWith(".T")?"JPY":t.endsWith(".AX")?"AUD":t.endsWith(".KS")?"KRW":t.endsWith(".TW")?"TWD":"USD";
  return {wkn:identity.wkn||null,isin:identity.isin||null,roe,ebitMargin,equityRatio,pe,pe5yAvg,analystBuyPct,earningsReactionPct,epsRevision4w:null,analystSellPct,analystCount,capClass:ok(m.marketCapitalization)&&m.marketCapitalization>5000?"large":"small",perf6m:okz(m["26WeekPriceReturnDaily"])?m["26WeekPriceReturnDaily"]:null,perf12m:okz(m["52WeekPriceReturnDaily"])?m["52WeekPriceReturnDaily"]:null,epsGrowthNextVsCurrent:null,analystTargetUpside,currentPrice,currency,_endpointErrors:endpointErrors||null};
}

async function fetchWithRetry(stock,key,signal) {
  let lastErr;
  for(let i=0;i<=MAX_RETRIES;i++){
    try{return await fetchFinnhubStock(stock,key,signal);}
    catch(e){lastErr=e;if(e.name==="AbortError"||/401|403/.test(e.message)) throw e;if(i<MAX_RETRIES) await new Promise((resolve,reject)=>{const t=setTimeout(resolve,Math.min(30000, RETRY_DELAY_MS*Math.pow(2,i)));signal?.addEventListener("abort",()=>{clearTimeout(t);reject(new DOMException("Abgebrochen","AbortError"));},{once:true});});}
  }
  throw lastErr||new Error("Finnhub-Abruf fehlgeschlagen");
}

// ── Region helpers ─────────────────────────────────────────────────
const EU_FLAGS = ["🇩🇪","🇫🇷","🇬🇧","🇨🇭","🇳🇱","🇮🇹","🇪🇸","🇫🇮","🇸🇪","🇩🇰","🇧🇪","🇦🇹","🇵🇹","🇳🇴"];
const REGIONS  = ["Alle","🇺🇸 USA","🇪🇺 Europa","🇯🇵 Japan","🇨🇳 China","🇮🇳 Indien","🇦🇺 Ozeanien","Andere"];

function regionMatch(s, f) {
  if (f==="Alle") return true;
  if (f==="🇺🇸 USA") return s.region==="🇺🇸";
  if (f==="🇪🇺 Europa") return EU_FLAGS.includes(s.region);
  if (f==="🇯🇵 Japan") return s.region==="🇯🇵";
  if (f==="🇨🇳 China") return s.region==="🇨🇳";
  if (f==="🇮🇳 Indien") return s.region==="🇮🇳";
  if (f==="🇦🇺 Ozeanien") return ["🇦🇺","🇳🇿"].includes(s.region);
  return !["🇺🇸",...EU_FLAGS,"🇯🇵","🇨🇳","🇮🇳","🇦🇺","🇳🇿"].includes(s.region);
}

// ── CSV Export ─────────────────────────────────────────────────────
function exportCSV(rows, name) {
  const csv = rows.map(r =>
    r.map(v => '"'+String((v !== null && v !== undefined ? v : "")).replace(/"/g,'""')+'"').join(",")
  ).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
  a.download = name; a.click();
}

// Connection test panel
async function testFinnhubConnection(key) {
  const url = "https://finnhub.io/api/v1/quote?symbol=AAPL&token="+key;
  let resp;
  try {
    resp = await fetch(url,{method:"GET",mode:"cors",credentials:"omit",headers:{"Accept":"application/json"}});
  } catch(e) {
    return {ok:false,msg:"Netzwerkfehler: "+e.message,raw:null};
  }
  if (resp.status===401||resp.status===403)
    return {ok:false,msg:"API Key ungültig ("+resp.status+")",raw:null};
  if (resp.status===429)
    return {ok:false,msg:"Rate Limit (429) — 60s warten",raw:null};
  if (!resp.ok) return {ok:false,msg:"HTTP "+resp.status,raw:null};
  let text="";
  try{text=await resp.text();}catch(e){}
  if (text.trim().charAt(0)==="<")
    return {ok:false,msg:"HTML-Antwort (Rate-Limit?)",raw:text.slice(0,60)};
  let data;
  try{data=JSON.parse(text);}catch(e){return {ok:false,msg:"Kein JSON",raw:text.slice(0,60)};}
  if (!data||!data.c||data.c<=0)
    return {ok:false,msg:"Ungültige Daten",raw:text.slice(0,60)};
  return {ok:true,msg:"Verbindung OK · AAPL: $"+data.c.toFixed(2),raw:null};
}

function ConnTestPanel({apiKey, onResult}) {
  const [state,  setState]  = useState("idle");
  const [result, setResult] = useState(null);
  const [prevKey,setPrevKey]= useState("");

  useEffect(()=>{
    if (!apiKey||apiKey.length<8){setState("idle");setResult(null);onResult(false);return;}
    if (apiKey===prevKey) return;
    const t = setTimeout(async()=>{
      setState("loading");
      const res = await testFinnhubConnection(apiKey);
      setState(res.ok?"ok":"fail");
      setResult(res);
      setPrevKey(apiKey);
      onResult(res.ok);
    },800);
    return ()=>clearTimeout(t);
  },[apiKey]);

  async function retest(){
    setState("loading");setResult(null);
    const res = await testFinnhubConnection(apiKey);
    setState(res.ok?"ok":"fail");
    setResult(res);
    setPrevKey(apiKey);
    onResult(res.ok);
  }

  const col = state==="ok"?A.green:state==="fail"?A.red:A.t3;

          {state==="idle"&&"Verbindungstest startet automatisch…"}

    vk:results.filter(r=>r.recommendation==="VERKAUFEN").length,
    live:results.length,
    avg:results.length>0
      ?(results.reduce((s,r)=>s+(r.totalScore||0),0)/results.length).toFixed(1)
      :"—",
  }),[results]);

  if (!results.length) return (
    <div style={{
      display:"flex",flexDirection:"column",alignItems:"center",
      justifyContent:"center",padding:"60px 24px",textAlign:"center",
    }}>
      <div style={{
        width:64,height:64,borderRadius:22,
        background:"linear-gradient(180deg,rgba(255,255,255,0.14),rgba(255,255,255,0.05))",display:"flex",alignItems:"center",
        justifyContent:"center",fontSize:32,marginBottom:16,border:"1px solid rgba(255,255,255,0.14)",

    const hdr=["Rang","Name","Ticker","Region","Sektor","Score","Rating","Daten%","Kurs","Währung","Quelle"];
    const rows=sorted.map((s,i)=>[
      i+1,s.name,s.ticker,s.region,s.sector,
      fmtS(s.totalScore),s.recommendation,(s.dataCompleteness||0)+"%",
      s.currentPrice!=null?s.currentPrice.toFixed(2):"—",
      s.currency||"—",
      "LIVE",
    ]);
    const csv=rows.map(r=>r.map(v=>'"'+String((v !== null && v !== undefined ? v : "")).replace(/"/g,'""')+'"').join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\uFEFF"+hdr.map(h=>'"'+h+'"').join(",")+
      "\n"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download="levermann_"+new Date().toISOString().slice(0,10)+".csv";
    a.click();
  }

  const statItems = [
    {l:"Analysiert",v:stats.total,     c:A.blue,   i:"🔍"},
    {l:"Ø Score",   v:stats.avg,       c:A.t1,     i:"📊"},

          }}>
            <div style={{fontSize:20,marginBottom:4}}>{s.i}</div>
            <div style={{
              fontSize:22,fontWeight:700,color:s.c,
              fontFamily:A.mono,lineHeight:1,

            <div style={{
              fontSize:10,color:A.t3,marginTop:4,
              textTransform:"uppercase",letterSpacing:"0.5px",

          </div>
        ))}
      </div>

      {/* Controls */}
      <Card pad="14px 16px">
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>

            {["ALLE","KAUFEN","HALTEN","VERKAUFEN"].map(f=>(
              <button key={f} onClick={()=>setFilter(f)} style={{
                padding:"6px 14px",borderRadius:100,border:"none",
                background:filter===f?filterCols[f]+"22":"rgba(255,255,255,0.06)",
                color:filter===f?filterCols[f]:A.t2,
                fontSize:13,fontWeight:filter===f?600:400,

              }}>{f}</button>
            ))}
          </div>
          <div style={{display:"flex",gap:6}}>
            {[{id:"score",l:"Score"},{id:"name",l:"Name"},{id:"rating",l:"Rating"}].map(s=>(
              <button key={s.id} onClick={()=>setSort(s.id)} style={{
                padding:"6px 12px",borderRadius:100,border:"none",
                background:sort===s.id?A.blue+"22":"rgba(255,255,255,0.06)",

                fontSize:13,fontWeight:sort===s.id?600:400,

            <button onClick={doExport} style={{

            }}>⬇ CSV</button>
          </div>
        </div>
      </Card>

      {/* Table */}
      <div style={{background:A.card,borderRadius:22,overflow:"hidden",border:A.cardBorder,boxShadow:A.cardShadow,backdropFilter:"saturate(180%) blur(22px)",WebkitBackdropFilter:"saturate(180%) blur(22px)"}}>
        <div style={{
          display:"grid",gridTemplateColumns:RPT_GRID,
          padding:"10px 16px",gap:4,
          borderBottom:"1px solid "+A.sep,background:"rgba(255,255,255,0.06)",
          position:"sticky",top:0,zIndex:10,

          {["#","Name","Ticker","WKN","Score","Daten","Kurs","Quelle","Rating"].map((h,i)=>(
            <div key={h} style={{

// ── Root App ──────────────────────────────────────────────────────
function App() {
  const [apiKey,   setApiKey]   = useState("");
  const [connOk,   setConnOk]   = useState(false);
  const [symbolsText, setSymbolsText] = useState(DEFAULT_SYMBOLS);
  const [count,    setCount]    = useState(5);
  const [plan, setPlan] = useState("free");
  const [running,  setRunning]  = useState(false);
  const [results,  setResults]  = useState([]);
  const [errors,   setErrors]   = useState([]);
  const [progress, setProgress] = useState(0);
  const [curTick,  setCurTick]  = useState("");
  const [done,     setDone]     = useState(false);
  const [tab,      setTab]      = useState("scanner");

  const abortRef = useRef(null);
  const resRef   = useRef([]);
  const errRef   = useRef([]);
  const symbols = useMemo(()=>symbolsText.split(/[\s,;]+/).map(x=>x.trim().toUpperCase()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).slice(0,MAX_SYMBOLS),[symbolsText]);
  const maxN = Math.min(count, symbols.length);

  const runFinnhub = useCallback(async()=>{
    if(!apiKey.trim()||!connOk) return;
    abortRef.current=new AbortController();resRef.current=[];errRef.current=[];
    setRunning(true);setDone(false);setResults([]);setErrors([]);setProgress(0);
    const batch=symbols.slice(0,maxN).map(ticker=>({ticker,name:ticker,sector:"Unbekannt",region:""}));
    let done_=0;
    for(let i=0;i<batch.length;i+=CONCURRENCY){
      if(abortRef.current?.signal.aborted) break;
      const chunk=batch.slice(i,i+CONCURRENCY);
      setCurTick(chunk.map(s=>s.ticker).join(", "));
      const settled=await Promise.allSettled(chunk.map(async s=>{
        const raw=await fetchWithRetry(s,apiKey,abortRef.current.signal);
        return {...s,...raw,...calcScore(raw,s.sector)};
      }));
      settled.forEach((r,idx)=>{
        if(r.status==="fulfilled"){
          resRef.current=[...resRef.current,r.value];
          setResults([...resRef.current]);
        } else {
          errRef.current=[...errRef.current,{...chunk[idx],error:(r.reason && r.reason.message ? r.reason.message : "Fehler")}];
          setErrors([...errRef.current]);
        }
      });
      done_+=chunk.length;
      setProgress(Math.round(done_/batch.length*100));
      if(i+CONCURRENCY<batch.length) await new Promise(r=>setTimeout(r,BATCH_DELAY_MS));
    }
    setRunning(false);setDone(true);setCurTick("");
  },[apiKey,connOk,maxN,symbols]);

  const estMin = Math.ceil(maxN*3.6/60);
  const estSec = Math.round(maxN*3.6);

  const canStart = !!apiKey && connOk;

  const TABS=[
    {id:"scanner",label:"Scanner",icon:"⚡"},
    {id:"report", label:"Ergebnisse"+(results.length>0?" ("+results.length+")":""),icon:"📋"},
  ];

  return (
    <div style={{
      minHeight:"100vh",background:"transparent",color:A.t1,fontFamily:A.font,
      paddingTop:"env(safe-area-inset-top,0px)",
    }}>

      {/* Header — Apple Navigation Bar style */}
      <div style={{
        background:"rgba(6,7,11,0.72)",
        backdropFilter:"saturate(180%) blur(28px)",
        WebkitBackdropFilter:"saturate(180%) blur(28px)",
        borderBottom:"0.5px solid rgba(255,255,255,0.12)",
        boxShadow:"0 10px 30px rgba(0,0,0,0.22)",
        padding:"18px 20px 16px",position:"sticky",top:0,zIndex:100,
      }}>
        <div style={{maxWidth:860,margin:"0 auto"}}>
          <div style={{
            fontSize:11,fontWeight:600,color:A.blue,
            textTransform:"uppercase",letterSpacing:"0.8px",
            marginBottom:4,
          }}>MSCI ACWI · Levermann · {APP_VERSION} · {BUILD_DATE}</div>
          <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between"}}>
            <h1 style={{
              fontSize:32,fontWeight:800,letterSpacing:"-0.8px",lineHeight:1,
            }}>
              Top‑30 <span style={{color:A.blue}}>Screening</span>
            </h1>
            <div style={{fontSize:12,color:A.t3,marginBottom:2}}>
              {symbols.length} Symbole
            </div>
          </div>
        </div>
      </div>

      {/* Tab bar — Apple style */}
      <div style={{
        background:"rgba(6,7,11,0.58)",
        backdropFilter:"saturate(180%) blur(24px)",WebkitBackdropFilter:"saturate(180%) blur(24px)",
        borderBottom:"0.5px solid rgba(255,255,255,0.08)",
        padding:"0 20px",position:"sticky",top:64,zIndex:99,
      }}>
        <div style={{maxWidth:860,margin:"0 auto",display:"flex",gap:24}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              display:"flex",alignItems:"center",gap:6,
              padding:"12px 0",background:"transparent",border:"none",
              borderBottom:"2px solid "+(tab===t.id?A.blue:"transparent"),
              color:tab===t.id?A.blue:A.t3,
              fontWeight:tab===t.id?600:400,fontSize:15,
              cursor:"pointer",fontFamily:A.font,transition:"all .2s",
              letterSpacing:"-0.1px",
            }}>
              <span style={{fontSize:14}}>{t.icon}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:960,margin:"0 auto",padding:"24px 18px 56px"}}>

        {tab==="scanner" && (
          <div className="fade-up">

            {/* Finnhub Key */}
            <Card style={{
                border:"1px solid "+(connOk?A.green+"44":!apiKey?A.sep:"rgba(255,255,255,0.05)"),
                transition:"border-color .3s",
              }}>
                <div style={{fontSize:13,fontWeight:600,color:A.t3,marginBottom:10,
                  textTransform:"uppercase",letterSpacing:"0.5px"}}>
                  🔑 Finnhub API Key
                </div>
                <input type="password"
                  placeholder="Key von finnhub.io"
                  value={apiKey}
                  onChange={e=>{setApiKey(e.target.value);setConnOk(false);}}
                />
                <div style={{
                  marginTop:10,fontSize:13,color:A.t3,lineHeight:1.6,
                }}>
                  <a href="https://finnhub.io" style={{color:A.blue,textDecoration:"none"}}>
                    finnhub.io
                  </a>
                  {" "}→ Registrieren → Dashboard → API Key kopieren
                </div>
                <ConnTestPanel apiKey={apiKey} onResult={ok=>setConnOk(ok)}/>
              </Card>

            {/* Slider */}
            <Card>
              <div style={{
                display:"flex",justifyContent:"space-between",
                alignItems:"baseline",marginBottom:16,
              }}>
                <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                  <span style={{
                    fontSize:40,fontWeight:700,fontFamily:A.mono,
                    color:A.t1,letterSpacing:"-1px",lineHeight:1,
                  }}>{maxN}</span>
                  <span style={{fontSize:17,color:A.t3}}>Aktien</span>
                </div>
                <div style={{textAlign:"right"}}>
                  {false ? (
                    <span style={{
                      fontSize:13,color:A.green,fontWeight:600,
                      background:A.greenBg,padding:"4px 10px",borderRadius:100,
                    }}>⚡ Sofort</span>
                  ) : (
                    <span style={{fontSize:13,color:A.t3}}>
                      ~{estMin} Min. / {estSec}s
                    </span>
                  )}
                </div>
              </div>

              <textarea value={symbolsText} onChange={e=>setSymbolsText(e.target.value)} disabled={running} placeholder="Ticker durch Komma, Leerzeichen oder Zeilenumbruch trennen" style={{minHeight:90,resize:"vertical"}} />
              <div style={{fontSize:12,color:A.t3,marginTop:8}}>Auswahl: {symbols.length}/{MAX_SYMBOLS} Symbole · Filter: Eingabe oben bearbeiten</div>
              <select value={plan} onChange={e=>{setPlan(e.target.value);RATE_BUCKET.rate=FINNHUB_PLAN[e.target.value].callsPerMinute/60000;RATE_BUCKET.capacity=FINNHUB_PLAN[e.target.value].burst;}} disabled={running} style={{marginTop:10}}><option value="free">Free · 60 Calls/Minute</option><option value="paid">Paid · 300 Calls/Minute</option></select>
              <input type="range" min={1} max={Math.max(1,symbols.length)}
                step={5} value={count}
                onChange={e=>setCount(+e.target.value)}
                disabled={running}/>

              <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
                {[10,25,50,100,200,500].filter(v=>v<=symbols.length).map(v=>(
                  <span key={v} onClick={()=>!running&&setCount(v)} style={{
                    fontSize:12,fontFamily:A.mono,cursor:"pointer",
                    color:v===count?A.blue:A.t3,
                    fontWeight:v===count?700:400,
                    transition:"color .15s",
                  }}>{v}</span>
                ))}
              </div>
            </Card>

            {/* Action buttons */}
            <div style={{display:"flex",gap:10,marginBottom:12}}>
              <div style={{flex:1}}>
                <PrimaryBtn
                  onClick={runFinnhub}
                  disabled={running||!canStart}
                >
                  {running
                    ? "Analysiere… ("+progress+"%)"
                    : done
                      ? "Erneut analysieren"
                      : !canStart
                        ? "Verbindung prüfen ↑"
                        : maxN+" Aktien analysieren"}
                </PrimaryBtn>
              </div>
              {running && (
                <PrimaryBtn
                  danger
                  onClick={()=>{abortRef.current?.abort();setRunning(false);setDone(true);}}
                >
                  Stop
                </PrimaryBtn>
              )}
            </div>

            {/* Progress */}
            {running && (
              <Card pad="14px 16px">
                <div style={{
                  display:"flex",justifyContent:"space-between",
                  alignItems:"center",marginBottom:4,
                }}>
                  <span style={{
                    fontSize:13,fontWeight:600,
                    color:resRef.current.some(r=>r._endpointErrors&&
                      r._endpointErrors.includes("Rate-Limit"))
                      ?A.yellow:A.green,
                  }}>
                    {resRef.current.some(r=>r._endpointErrors&&
                      r._endpointErrors.includes("Rate-Limit"))
                      ?"⚠ Rate-Limit erkannt"
                      :"📡 Finnhub Live-Abruf"}
                    {" · "+resRef.current.length+" live"}
                  </span>
                  <span style={{
                    fontSize:13,fontWeight:700,fontFamily:A.mono,color:A.blue,
                  }}>{progress}%</span>
                </div>
                <div style={{
                  fontSize:13,color:A.t3,marginBottom:10,
                  animation:"pulse 1.5s ease-in-out infinite",
                }}>{curTick}</div>
                <div style={{height:4,background:"rgba(255,255,255,0.08)",borderRadius:2,overflow:"hidden"}}>
                  <div style={{
                    height:"100%",width:progress+"%",borderRadius:2,
                    background:"linear-gradient(90deg,"+A.blue+","+A.green+")",
                    transition:"width .3s ease",
                  }}/>
                </div>
                {errors.length>0&&(
                  <details style={{marginTop:10}}>
                    <summary style={{fontSize:12,color:A.red,fontWeight:500}}>
                      {errors.length} Fehler
                    </summary>
                    <div style={{
                      fontSize:11,color:A.t3,marginTop:6,fontFamily:A.mono,lineHeight:1.8,
                    }}>
                      {errors.map(e=>e.ticker+": "+e.error).join(" | ")}
                    </div>
                  </details>
                )}
              </Card>
            )}

            <ResultsTable results={results} />

            {!running&&!done&&(
              <div style={{
                display:"flex",flexDirection:"column",
                alignItems:"center",justifyContent:"center",
                padding:"60px 24px",textAlign:"center",
              }}>
                <div style={{
                  width:80,height:80,borderRadius:24,
                  background:"linear-gradient(180deg,rgba(255,255,255,0.14),rgba(255,255,255,0.05))",display:"flex",alignItems:"center",
                  justifyContent:"center",fontSize:40,marginBottom:20,
                  border:"1px solid rgba(255,255,255,0.14)",boxShadow:"0 22px 50px rgba(0,0,0,0.30)",
                }}>🌍</div>
                <div style={{fontSize:22,fontWeight:600,marginBottom:8,letterSpacing:"-0.3px"}}>

                </div>
                <div style={{fontSize:15,color:A.t3,lineHeight:1.6,maxWidth:320}}>

        {tab==="report" && (
          <div className="fade-up">
            <ReportTab results={results} />
          </div>
        )}

      </div>
    </div>
  );

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = {err:null}; }
  renderError(e) { return {err:e}; }
  render() {
    if (this.state.err) return (
      <div style={{padding:24,fontFamily:"-apple-system,sans-serif",background:"#000",minHeight:"100vh"}}>
        <div style={{background:"#ff453a22",border:"1px solid #ff453a44",borderRadius:14,padding:20,color:"#ff453a"}}>
          <div style={{fontSize:17,fontWeight:700,marginBottom:8}}>&#9888; Render Fehler</div>
          <div style={{fontSize:14,marginBottom:8}}>{this.state.err.message}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",fontFamily:"monospace",whiteSpace:"pre-wrap"}}>
            {(this.state.err.stack||"").slice(0,500)}
          </div>
        </div>
      </div>
    );
    return this.props.children;
  }
}
ErrorBoundary.getDerivedStateFromError = function(e) { return {err:e}; };
